# Αυτόματο build για κάθε push στο main branch
# Ελέγχει αν ο κώδικας κάνει compile σωστά

name: Android CI

# Πότε τρέχει το workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Βήμα 1: Κατέβασε τον κώδικα
    - name: Checkout code
      uses: actions/checkout@v4

    # Βήμα 2: Ρύθμισε Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Βήμα 3: Setup Gradle (θα δημιουργήσει wrapper αν λείπει)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Βήμα 4: Build Debug APK
    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    # Βήμα 5: Upload APK ως artifact
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore

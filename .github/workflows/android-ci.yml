# Αυτόματο build για κάθε push στο main branch
# Ελέγχει αν ο κώδικας κάνει compile σωστά

name: Android CI

# Πότε τρέχει το workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Βήμα 1: Κατέβασε τον κώδικα
    - name: Checkout code
      uses: actions/checkout@v4

    # Βήμα 2: Ρύθμισε Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Βήμα 3: Setup Gradle (θα δημιουργήσει wrapper αν λείπει)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Βήμα 4: Δημιουργία dummy google-services.json για CI build
    - name: Create dummy google-services.json
      run: |
        cat > app/google-services.json << 'EOF'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "dummy-project-id",
            "storage_bucket": "dummy-project-id.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.repotracker"
                }
              },
              "api_key": [{"current_key": "dummy-api-key"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }
          ],
          "configuration_version": "1"
        }
        EOF

    # Βήμα 5: Build Debug APK
    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    # Βήμα 5: Upload APK ως artifact
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore
